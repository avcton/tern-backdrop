  <rect x="9" y="11" width="32" height="24" rx="5" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.6"/>
  <path d="M15 20 L19 23 L15 26" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 27 H29" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
