    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="44" cy="40" r="11" fill="#fde68a"/>
    <path d="M0 48 L16 33 L27 42 L39 29 L64 50 V64 H0 Z" fill="#3b0764" opacity="0.85"/>
